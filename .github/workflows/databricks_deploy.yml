name: "Databricks CI/CD Code Promotion Pipeline"

# Rebuild the Databricks dev resources from the protected main branch. The manual
# trigger lets you redeploy after cleaning up resources in the Databricks UI.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-dev:
    name: "Validate and Deploy Dev Bundle"
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Dev Bundle
        run: databricks bundle validate --target dev

      - name: Deploy Dev Bundle
        run: databricks bundle deploy --target dev
