# This is a Databricks asset bundle definition for databricks_streaming.
bundle:
  name: databricks_streaming
  uuid: 39a381ec-4720-4ac3-8b38-33db5373b83f

# Variable declarations mapping out our dynamic catalog environments
variables:
  catalog:
    description: "The targeted Unity Catalog environment"
    default: "enterprise_dev"
  schema:
    description: "The target execution database schema"
    default: "taxi_pipeline"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://databricks.com
    variables:
      catalog: enterprise_dev
      schema: taxi_pipeline
    resources:
      pipelines:
        dev_taxi_lakeflow_pipeline:
          name: "[dev]_${workspace.current_user.short_name}_taxi_pipeline"
          target: ${var.schema}
          catalog: ${var.catalog}
          channel: "current"
          serverless: true 
          libraries:
            - notebook:
                path: ./src/sample_notebook.ipynb

  qa:
    mode: production
    workspace:
      host: https://databricks.com
    variables:
      catalog: enterprise_qa
      schema: taxi_pipeline
    resources:
      pipelines:
        qa_taxi_lakeflow_pipeline:
          name: "qa_taxi_pipeline"
          target: ${var.schema}
          catalog: ${var.catalog}
          channel: "current"
          serverless: true
          libraries:
            - notebook:
                path: ./src/sample_notebook.ipynb

  prod:
    mode: production
    workspace:
      host: https://databricks.com
      root_path: /Workspace/Users/sathyarajesh007@://gmail.com{bundle.name}/${bundle.target}
    variables:
      catalog: enterprise_prod
      schema: taxi_pipeline
    permissions:
      - user_name: sathyarajesh007@gmail.com
        level: CAN_MANAGE
    resources:
      pipelines:
        prod_taxi_lakeflow_pipeline:
          name: "prod_taxi_pipeline"
          target: ${var.schema}
          catalog: ${var.catalog}
          channel: "current"
          serverless: true
          libraries:
            - notebook:
                path: ./src/sample_notebook.ipynb
