# This is a Databricks asset bundle definition for databricks_streaming.
bundle:
  name: databricks_streaming
  uuid: 39a381ec-4720-4ac3-8b38-33db5373b83f

variables:
  catalog:
    description: "The targeted Unity Catalog environment"
    default: "enterprise_dev"
  schema:
    description: "The target execution database schema"
    default: "taxi_pipeline"
  source_path:
    description: "The managed volume path where streaming taxi JSON files land"
    default: "/Volumes/enterprise_dev/raw_landing/streaming_source"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a7db973c-45ee.cloud.databricks.com
    variables:
      catalog: enterprise_dev
      schema: taxi_pipeline
      source_path: /Volumes/enterprise_dev/raw_landing/streaming_source
    resources:
      pipelines:
        dev_taxi_lakeflow_pipeline:
          name: "taxi_pipeline"
          target: ${var.schema}
          catalog: ${var.catalog}
          channel: "current"
          serverless: true
          configuration:
            source_path: ${var.source_path}
          libraries:
            - notebook:
                path: ./src/pipeline.py
